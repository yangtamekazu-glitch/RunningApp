<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Route Auto Generator</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='icon.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.jpg') }}">
    <!-- 共通のスタイルとフォント -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- 地図表示領域 -->
    <div id="map"></div>
    
    <!-- UIコントロールパネル -->
    <div id="ui-panel">
        <div id="panel-handle">
            <div class="handle-bar"></div>
        </div>
        <div id="panel-content">
            <h1>Route Generator</h1>
        <p class="description">
            マップ上をタップしてスタート地点とゴール地点を設定してください。<br>
            設定後、「経由地を追加」ボタンから経由地を配置できます。
        </p>
        <div class="input-group">
            <label for="distance">希望距離 (km)</label>
            <input type="number" id="distance" step="0.1" min="1" value="5.0">
        </div>
        <div class="input-group">
            <label for="elevation">高低差</label>
            <select id="elevation" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; background: white;">
                <option value="any">気にしない</option>
                <option value="flat">なるべく平坦</option>
                <option value="hilly">坂多め</option>
            </select>
        </div>
        <div id="saved-locations-section" style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom: 8px; font-weight: 600; color: var(--text-color);">★ お気に入り（ブックマーク）登録地点</label>
            <div id="saved-locations-list" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <!-- JSで動的に追加されます -->
            </div>
            <button id="save-current-btn" class="secondary" style="margin-top: 8px; font-size: 0.85rem; padding: 6px 12px; background: rgba(0,0,0,0.05);">
                + マップ中央の地点を保存する
            </button>
        </div>

        <button id="current-location-btn" class="secondary" style="margin-bottom: 12px;">📍 現在地からスタート</button>
        <button id="add-waypoint-btn" class="secondary" style="display:none; margin-bottom: 12px;">📍 経由地を追加</button>
        <button id="generate-btn">ルートを生成する</button>
        <button id="open-google-maps-btn" class="secondary" style="display:none; margin-bottom: 12px;">🗺️ Googleマップで開く</button>
        <button id="reset-btn" class="secondary">クリア</button>
        <div id="status">マップ上でスタート地点をクリックしてください。</div>
        </div>
    </div>
    
    <!-- Google Maps API (バックエンドから環境変数経由で埋め込み) -->
    <!-- 注意：ポリラインを描画するために geometry ライブラリを読み込んでいます -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key }}&libraries=geometry&callback=initMap" async defer></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
